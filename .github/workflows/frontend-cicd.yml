name: Frontend CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-output
          path: |
            .next
            package.json
            package-lock.json
          retention-days: 3

  deploy:
    name: Deploy to Frontend EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download build artifacts (for record)
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-output
          path: build-artifact

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          FRONTEND_PROJECT_PATH: ${{ secrets.FRONTEND_PROJECT_PATH }}
          FRONTEND_ENV_FILE: ${{ secrets.FRONTEND_ENV_FILE }}
        with:
          host: ${{ secrets.FRONTEND_SSH_HOST }}
          username: ${{ secrets.FRONTEND_SSH_USER }}
          key: ${{ secrets.FRONTEND_SSH_KEY }}
          port: ${{ secrets.FRONTEND_SSH_PORT || '22' }}
          script_stop: true
          envs: FRONTEND_PROJECT_PATH,FRONTEND_ENV_FILE
          script: |
            set -euo pipefail
            cd ${FRONTEND_PROJECT_PATH}
            git fetch --all
            git checkout main
            git reset --hard origin/main
            cat <<'EOF' > .env.production
${FRONTEND_ENV_FILE}
EOF
            docker compose pull --ignore-pull-failures
            docker compose up -d --build frontend nginx
            docker image prune -f

